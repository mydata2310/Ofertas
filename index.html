<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ofertas SV</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--card:#f4f4f5;--ac:#d92d20}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mut:#999;--card:#1c1c1e}}
body{font:15px system-ui;margin:0;padding:12px;background:var(--bg);color:var(--fg);max-width:700px;margin:auto}
input,select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--mut);background:var(--card);color:var(--fg)}
#f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}#f input{flex:1;min-width:120px}
a.c{display:flex;gap:10px;background:var(--card);border-radius:10px;padding:8px;margin:6px 0;text-decoration:none;color:inherit}
img{width:64px;height:64px;object-fit:contain;border-radius:6px}
.d{color:#fff;background:var(--ac);border-radius:6px;padding:2px 6px;font-weight:700}
s{color:var(--mut)}small{color:var(--mut)}
</style></head><body>
<div id="f">
  <input id="q" placeholder="Buscar (leche, TV...)">
  <select id="m"><option value="10">+10%</option><option value="30" selected>+30%</option><option value="50">+50%</option></select>
  <select id="t"><option value="">Todas</option></select>
</div>
<small id="s">Cargando…</small><div id="l"></div>
<script>
let D=[];
const $=i=>document.getElementById(i);
async function cargar(){
  $("s").textContent="Cargando…";
  try{
    const r=await fetch(`/.netlify/functions/ofertas?min=${$("m").value}&q=${encodeURIComponent($("q").value)}`);
    const j=await r.json(); D=j.datos;
    const ts=[...new Set(D.map(x=>x.tienda))];
    if($("t").options.length==1) ts.forEach(x=>$("t").add(new Option(x,x)));
    pintar(j.errores);
  }catch(e){$("s").textContent="Error: "+e.message}
}
function pintar(err=[]){
  const f=D.filter(x=>!$("t").value||x.tienda==$("t").value);
  $("l").innerHTML=f.map(x=>`<a class="c" href="${x.url}" target="_blank" rel="noopener">
    <img src="${x.img}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
    <div><span class="d">-${x.desc}%</span> <b>$${x.precio.toFixed(2)}</b> <s>$${x.antes.toFixed(2)}</s><br>
    ${x.nombre}<br><small>${x.tienda}</small></div></a>`).join("");
  $("s").textContent=`${f.length} ofertas`+(err.length?` · fallaron: ${err.map(e=>e.tienda+" ("+e.error+")").join(", ")}`:"");
}
$("q").oninput=()=>{clearTimeout(window._d);window._d=setTimeout(cargar,500)};
$("m").onchange=cargar;$("t").onchange=()=>pintar();
cargar();
</script></body></html>
