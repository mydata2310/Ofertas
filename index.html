<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ofertas SV</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--card:#f4f4f5;--ac:#d92d20;--ok:#067647}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mut:#999;--card:#1c1c1e;--ok:#4ade80}}
body{font:15px system-ui;margin:auto;padding:12px;background:var(--bg);color:var(--fg);max-width:700px}
input,select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--mut);background:var(--card);color:var(--fg);min-width:0}
#f{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
#q{grid-column:1/3}
a.c{display:flex;gap:10px;background:var(--card);border-radius:10px;padding:8px;margin:6px 0;text-decoration:none;color:inherit}
img{width:64px;height:64px;object-fit:contain;border-radius:6px;flex:none}
.d{color:#fff;background:var(--ac);border-radius:6px;padding:2px 6px;font-weight:700}
.a{color:var(--ok);font-size:13px}
s{color:var(--mut)}small{color:var(--mut)}
</style></head><body>
<div id="f">
  <input id="q" placeholder="Buscar (leche, TV...)">
  <select id="o">
    <option value="d-">Mayor descuento %</option>
    <option value="d+">Menor descuento %</option>
    <option value="s-">Mayor ahorro $</option>
    <option value="p+">Precio: menor a mayor</option>
    <option value="p-">Precio: mayor a menor</option>
    <option value="n+">Nombre A-Z</option>
  </select>
  <select id="t"><option value="">Todas las tiendas</option></select>
  <select id="m">
    <option value="0">Cualquier descuento</option>
    <option value="10">+10%</option>
    <option value="30" selected>+30%</option>
    <option value="50">+50%</option>
    <option value="70">+70%</option>
  </select>
  <input id="p" type="number" inputmode="decimal" placeholder="Precio máx. $">
</div>
<small id="s">Cargando…</small><div id="l"></div>
<script>
let D=[],E=[];
const $=i=>document.getElementById(i);
const ord={
  "d-":(a,b)=>b.desc-a.desc,"d+":(a,b)=>a.desc-b.desc,
  "s-":(a,b)=>(b.antes-b.precio)-(a.antes-a.precio),
  "p+":(a,b)=>a.precio-b.precio,"p-":(a,b)=>b.precio-a.precio,
  "n+":(a,b)=>a.nombre.localeCompare(b.nombre)
};
async function cargar(){
  $("s").textContent="Cargando…";
  try{
    const r=await fetch(`/.netlify/functions/ofertas?min=${$("m").value}&q=${encodeURIComponent($("q").value)}`);
    const j=await r.json();D=j.datos;E=j.errores;
    const sel=$("t").value;
    $("t").length=1;
    [...new Set(D.map(x=>x.tienda))].forEach(x=>$("t").add(new Option(x,x)));
    $("t").value=sel;
    pintar();
  }catch(e){$("s").textContent="Error: "+e.message}
}
function pintar(){
  const max=+$("p").value||Infinity;
  const f=D.filter(x=>(!$("t").value||x.tienda==$("t").value)&&x.precio<=max).sort(ord[$("o").value]);
  $("l").innerHTML=f.map(x=>`<a class="c" href="${x.url}" target="_blank" rel="noopener">
    <img src="${x.img}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
    <div><span class="d">-${x.desc}%</span> <b>$${x.precio.toFixed(2)}</b> <s>$${x.antes.toFixed(2)}</s>
    <span class="a">ahorras $${(x.antes-x.precio).toFixed(2)}</span><br>
    ${x.nombre}<br><small>${x.tienda}</small></div></a>`).join("");
  $("s").textContent=`${f.length} ofertas`+(E.length?` · fallaron: ${E.map(e=>e.tienda+" ("+e.error+")").join(", ")}`:"");
}
$("q").oninput=()=>{clearTimeout(window._d);window._d=setTimeout(cargar,500)};
$("m").onchange=cargar;
$("o").onchange=$("t").onchange=()=>pintar();
$("p").oninput=()=>pintar();
cargar();
</script></body></html>
